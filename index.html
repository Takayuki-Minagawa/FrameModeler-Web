<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameModeler Web v1.0.0</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <!-- ツールバー -->
      <header id="toolbar" role="toolbar" data-i18n-aria-label="aria.toolbar" aria-label="作図ツールバー">
        <div class="toolbar-group" role="group" data-i18n-aria-label="aria.fileActions" aria-label="ファイル操作">
          <button id="btn-new" data-i18n="new" data-i18n-title="title.new">新規</button>
          <button id="btn-open" data-i18n="open" data-i18n-title="title.open">開く</button>
          <button id="btn-save" data-i18n="save" data-i18n-title="title.save">保存</button>
          <button id="btn-validate" data-i18n="validate" data-i18n-title="title.validate">検証</button>
          <button id="btn-import-info" data-i18n="importInfo" data-i18n-title="title.importInfo">読込情報</button>
        </div>
        <div class="toolbar-separator" role="separator" aria-orientation="vertical"></div>
        <div class="toolbar-group" role="group" data-i18n-aria-label="aria.drawingTools" aria-label="作図ツール">
          <button
            id="btn-select"
            class="tool-btn active"
            aria-pressed="true"
            data-i18n="select"
            data-i18n-title="title.select"
          >
            選択
          </button>
          <button id="btn-move" class="tool-btn" aria-pressed="false" data-i18n="move" data-i18n-title="title.move">
            移動
          </button>
          <button id="btn-add-node" class="tool-btn" aria-pressed="false" data-i18n="node" data-i18n-title="title.node">
            節点
          </button>
          <button id="btn-add-beam" class="tool-btn" aria-pressed="false" data-i18n="beam" data-i18n-title="title.beam">
            梁
          </button>
          <button
            id="btn-add-pillar"
            class="tool-btn"
            aria-pressed="false"
            data-i18n="pillar"
            data-i18n-title="title.pillar"
          >
            柱
          </button>
          <button
            id="btn-add-floor"
            class="tool-btn"
            aria-pressed="false"
            data-i18n="floor"
            data-i18n-title="title.floor"
          >
            床
          </button>
          <button id="btn-add-wall" class="tool-btn" aria-pressed="false" data-i18n="wall" data-i18n-title="title.wall">
            壁
          </button>
          <button
            id="btn-add-bearwall"
            class="tool-btn"
            aria-pressed="false"
            data-i18n="bearwall"
            data-i18n-title="title.bearwall"
          >
            耐力壁
          </button>
        </div>
        <div class="toolbar-separator" role="separator" aria-orientation="vertical"></div>
        <div class="toolbar-group" role="group" data-i18n-aria-label="aria.viewOptions" aria-label="表示設定">
          <label data-i18n-after="grid"><input type="checkbox" id="chk-grid" checked /> グリッド</label>
          <label data-i18n-after="snap"><input type="checkbox" id="chk-snap" checked /> スナップ</label>
          <label data-i18n-after="3d"><input type="checkbox" id="chk-3d" /> 3D表示</label>
        </div>
        <div
          class="toolbar-group"
          role="group"
          data-i18n-aria-label="aria.gridSettings"
          aria-label="グリッドとスナップの設定"
        >
          <label data-i18n-label="gridWidth"
            >グリッド幅: <input type="number" id="input-grid-width" value="100" min="5" step="10"
          /></label>
          <label data-i18n-label="snapWidth"
            >スナップ幅: <input type="number" id="input-snap-width" value="10" min="1" step="5"
          /></label>
        </div>
        <div
          class="toolbar-group coordinate-entry"
          role="group"
          data-i18n-aria-label="aria.coordinateEntry"
          aria-label="座標数値入力"
        >
          <label
            >X
            <input
              type="number"
              id="input-coordinate-x"
              value="0"
              step="any"
              aria-label="X座標"
              data-i18n-aria-label="coordinate.x"
          /></label>
          <label
            >Y
            <input
              type="number"
              id="input-coordinate-y"
              value="0"
              step="any"
              aria-label="Y座標"
              data-i18n-aria-label="coordinate.y"
          /></label>
          <label
            >Z
            <input
              type="number"
              id="input-coordinate-z"
              value="0"
              step="any"
              aria-label="Z座標"
              data-i18n-aria-label="coordinate.z"
          /></label>
          <button id="btn-coordinate-commit" data-i18n="coordinate.commit" data-i18n-title="title.coordinateCommit">
            入力
          </button>
        </div>
        <div class="toolbar-group" role="group" data-i18n-aria-label="aria.editActions" aria-label="編集操作">
          <label data-i18n-label="selection.filter"
            >選択対象:
            <select id="select-selection-filter">
              <option value="all" data-i18n="selection.all">すべて</option>
              <option value="node" data-i18n="node">節点</option>
              <option value="beam" data-i18n="beam">梁</option>
              <option value="pillar" data-i18n="pillar">柱</option>
              <option value="floor" data-i18n="floor">床</option>
              <option value="wall" data-i18n="wall">壁</option>
              <option value="bearWall" data-i18n="bearwall">耐力壁</option>
            </select>
          </label>
          <button id="btn-undo" disabled data-i18n="undo" data-i18n-title="title.undo">元に戻す</button>
          <button id="btn-redo" disabled data-i18n="redo" data-i18n-title="title.redo">やり直す</button>
          <button id="btn-delete" data-i18n="delete" data-i18n-title="title.delete">削除</button>
        </div>
        <div class="toolbar-separator" role="separator" aria-orientation="vertical"></div>
        <div class="toolbar-group" role="group" data-i18n-aria-label="aria.appSettings" aria-label="ヘルプと表示設定">
          <button
            id="btn-help"
            data-i18n-title="title.help"
            data-i18n-aria-label="title.help"
            aria-label="操作マニュアル"
          >
            ?
          </button>
          <button
            id="btn-theme"
            data-i18n-title="title.theme"
            data-i18n-aria-label="title.theme"
            aria-label="テーマ切替"
          >
            &#9790;
          </button>
          <button id="btn-lang" data-i18n-title="title.lang" data-i18n-aria-label="title.lang" aria-label="言語切替">
            EN
          </button>
        </div>
      </header>

      <!-- メインコンテンツ -->
      <main id="main-content">
        <!-- レイヤーパネル -->
        <aside id="layer-panel" aria-labelledby="layer-title">
          <div id="layer-header">
            <span id="layer-title" data-i18n="layer">レイヤー</span>
            <button
              id="btn-add-layer"
              aria-controls="layer-list"
              data-i18n-title="title.addLayer"
              data-i18n-aria-label="title.addLayer"
              aria-label="レイヤー追加"
            >
              +
            </button>
            <button
              id="btn-remove-layer"
              aria-controls="layer-list"
              data-i18n-title="title.removeLayer"
              data-i18n-aria-label="title.removeLayer"
              aria-label="レイヤー削除"
            >
              -
            </button>
          </div>
          <ul id="layer-list" role="listbox" data-i18n-aria-label="aria.layers" aria-label="レイヤー一覧"></ul>
        </aside>

        <!-- CADビュー -->
        <div id="cad-view-container">
          <canvas id="cad-canvas" tabindex="0" data-i18n-aria-label="aria.cadCanvas" aria-label="構造フレーム作図領域"
            >構造フレーム作図領域です。この表示にはCanvas対応ブラウザが必要です。</canvas
          >
        </div>
      </main>

      <!-- ステータスバー -->
      <footer id="status-bar">
        <span id="status-version" aria-live="polite"></span>
        <span id="status-coord">(0.00, 0.00, 0.00)</span>
        <span id="status-info" role="status" aria-live="polite"></span>
      </footer>
    </div>

    <!-- ファイル入力（非表示） -->
    <input type="file" id="file-input" accept=".json,.yaml,.yml" style="display: none" />

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
