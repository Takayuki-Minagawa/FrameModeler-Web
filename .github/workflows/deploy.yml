name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # workflow_run is admitted only after CI (including Playwright) succeeds.
      # A manual deployment runs the same complete gate before publishing.
      - name: Quality, coverage, build and bundle budget
        if: github.event_name == 'workflow_dispatch'
        run: npm run check
      - name: Audit high-severity dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=high
      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Browser E2E and visual regression
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:built
      - name: Build the CI-verified commit
        if: github.event_name == 'workflow_run'
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
